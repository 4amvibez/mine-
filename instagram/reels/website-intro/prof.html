<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Archivo;src:url(fonts/ArchivoBlack.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#0B0B0C;font-family:Archivo,'Noto Color Emoji',sans-serif;position:relative}
#wrap{position:absolute;left:0;top:300px;width:1080px;height:1440px;transform-origin:239px 527px}
#wrap img{width:1080px;height:1440px;display:block}
#hl{position:absolute;left:38px;top:497px;width:400px;height:62px;border:7px solid #D9572B;border-radius:16px;opacity:0;box-shadow:0 0 30px rgba(217,87,43,.8)}
#fing{position:absolute;font-size:110px;opacity:0;left:0;top:0}
#rip{position:absolute;left:239px;top:527px;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:7px solid #fff;opacity:0}
.cap{position:absolute;left:60px;right:60px;text-align:center;color:#FFF6E0;line-height:1.1;opacity:0;background:#2B2118;border-radius:28px;padding:26px 30px;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:5}
.cap b{color:#FF7A45}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body>
<div id="wrap"><img src="profile.png"><div id="hl"></div><div id="rip"></div><div id="fing">👆</div></div>
<div class="cap" id="c1" style="top:90px;font-size:66px">I built a <b>FREE</b><br>Japanese study site 🇯🇵</div>
<div class="cap" id="c2" style="top:90px;font-size:72px"><b>100% FREE</b> 🎁</div>
<div class="cap" id="c3" style="top:1690px;font-size:54px">🔗 Link in bio · <b>@raj_in_jp</b></div>
<div id="flash"></div>
<script>
const M=new URLSearchParams(location.search).get('m')||'intro';
const cl=x=>Math.min(Math.max(x,0),1), ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const $=id=>document.getElementById(id);
window.TOTAL = M==='intro'?3.8:6.32;
window.render=t=>{
  if(M==='intro'){
    $('c1').style.opacity=cl((t-0.1)/0.35);
    const z=1+0.9*ease((t-0.6)/1.6); $('wrap').style.transform=`scale(${z})`;
    const f=$('fing'); f.style.opacity=t>1.4?1:0; const p=ease((t-1.4)/0.8);
    f.style.left=(239-20+260*(1-p))+'px'; f.style.top=(527+30+300*(1-p))+'px'; f.style.transform=`scale(${t>2.3&&t<2.5?0.85:1})`;
    $('hl').style.opacity=t>2.3?1:0;
    const r=cl((t-2.35)/0.5); $('rip').style.opacity=(t<2.35||t>2.85)?0:1-r; $('rip').style.transform=`scale(${1+4*r})`;
    $('flash').style.opacity=t>3.0?cl((t-3.0)/0.5)*0.9:0;
  } else {
    $('c2').style.opacity=cl((t-0.1)/0.35); $('c3').style.opacity=cl((t-0.9)/0.35);
    const z=1+0.25*ease(t/2.5); $('wrap').style.transform=`scale(${z})`;
    $('hl').style.opacity=t>1.2?(0.6+0.4*Math.abs(Math.sin((t-1.2)*3))):0;
    const f=$('fing'); f.style.opacity=(t>1.6&&t<5.6)?1:0; f.style.left=(239-20)+'px'; f.style.top=(527+40+15*Math.sin(t*4))+'px';
    $('flash').style.opacity=0;
  }
};
</script></body></html>
